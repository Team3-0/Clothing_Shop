<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist | Clothing Shop</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #f9f9f9;
    }

    .wishlist-container {
      width: 80%;
      margin: 120px auto;
      text-align: center;
    }

    .wishlist-container h1 {
      margin-bottom: 30px;
    }

    .empty-wishlist {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .empty-wishlist p {
      margin-bottom: 20px;
      font-size: 18px;
    }

    .go-shopping-btn {
      padding: 12px 25px;
      background: #222;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .go-shopping-btn:hover {
      background: #444;
    }

    .wishlist-item {
      cursor: pointer;
      background: #fff;
      padding: 20px;
      margin: 15px auto;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .wishlist-item img {
      width: 100%;
      border-radius: 10px;
    }

    .remove-heart {
      font-size: 25px;
      cursor: pointer;
      color: red;
    }
  </style>
  <script src="script.js" defer></script>
  <script src="wishlist.js" defer></script>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html" style="text-decoration:none;color:#000;">Clothing Shop</a></div>
    <nav>
      <ul>
        <li><a href="index.html">HOME</a></li>
      </ul>
    </nav>

    <div class="icons">
      <a href="search.html"><span>🔍</span></a>
      <a href="login.html"><span>👤</span></a>
      <a href="wishlist.html"><span>❤️</span></a>
      <a href="cart.html" class="cart-icon-link">
        <span class="cart-icon">🛒</span>
        <span id="cart-count" class="cart-count-badge">0</span>
      </a>
    </div>
  </header>

  <div class="wishlist-container">
    <h1>My Wishlist</h1>
    <div id="wishlist-content"></div>
  </div>

  <!-- Product Modal -->
  <div id="product-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <img id="modal-image" src="" alt="Product Image" />
      <h2 id="modal-title"></h2>
      <p id="modal-price"></p>
      <div class="sizes" id="modal-sizes"></div>
      <div class="modal-actions">
        <span id="wishlist-heart" class="wishlist-heart">♡</span>
        <button class="add-to-cart">Add to Cart 🛒</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Clothing Shop. All rights reserved.</p>
  </footer>
</body>
</html>
